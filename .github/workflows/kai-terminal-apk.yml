name: Build Kai Terminal APK

on:
  push:
    branches: ["build/kai-terminal-apk"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Prepare final APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KaiTerminal-v1.0.0.apk

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs dist/KaiTerminal-v1.0.0.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging dist/KaiTerminal-v1.0.0.apk | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaiTerminal-v1.0.0
          path: dist/KaiTerminal-v1.0.0.apk
          if-no-files-found: error
