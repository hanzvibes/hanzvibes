name: Build Kai Terminal V2 APK

on:
  push:
    branches: ["build/kai-terminal-v2"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build V2 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KaiTerminal-v2.0.0.apk
          sha256sum dist/KaiTerminal-v2.0.0.apk

      - name: Verify signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/KaiTerminal-v2.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/KaiTerminal-v2.0.0.apk | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaiTerminal-v2.0.0
          path: dist/KaiTerminal-v2.0.0.apk
          if-no-files-found: error
