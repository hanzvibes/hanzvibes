name: Pixel Dungeon Android Build

on:
  push:
    branches: [ pixel-dungeon-modernization ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Assemble source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/pd"
          cd "$RUNNER_TEMP/pd"
          git clone https://github.com/watabou/pixel-dungeon.git game
          git -C game checkout ca458a28f053612973d5d6059dae5f6f2ca4fcb7
          git clone https://github.com/watabou/PD-classes.git engine
          git -C engine checkout c0b690a4163020963e70a58a7d4f27965dc8f134

          mkdir -p modern/app/src/main/java/com/watabou modern/app/src/main/assets modern/app/src/main/res
          cp -R game/src/com/watabou/pixeldungeon modern/app/src/main/java/com/watabou/
          cp -R engine/com/watabou/* modern/app/src/main/java/com/watabou/
          cp -R game/assets/. modern/app/src/main/assets/
          cp -R game/res/. modern/app/src/main/res/

          cat > modern/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'PixelDungeonModern'
          include ':app'
          EOF

          cat > modern/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.4.1' apply false
          }
          EOF

          cat > modern/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.caching=true
          android.useAndroidX=false
          EOF

          cat > modern/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.watabou.pixeldungeon'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.watabou.pixeldungeon.modern'
                  minSdk 26
                  targetSdk 36
                  versionCode 200100
                  versionName '2.0.0-modern-preview'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              buildTypes {
                  debug { debuggable true }
                  release { minifyEnabled false }
              }
          }
          EOF

          cat > modern/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:enableOnBackInvokedCallback="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".PixelDungeon"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Apply Android + mobile UX modernization
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/pd/modern/app/src/main/java/com/watabou/pixeldungeon/io"
          cp "$GITHUB_WORKSPACE/pixel-dungeon-ci/SaveFiles.java" "$RUNNER_TEMP/pd/modern/app/src/main/java/com/watabou/pixeldungeon/io/SaveFiles.java"
          python3 "$GITHUB_WORKSPACE/pixel-dungeon-ci/modernize_sources.py" "$RUNNER_TEMP/pd/modern"

      - name: Build APK
        working-directory: ${{ runner.temp }}/pd/modern
        run: gradle :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          APK="$RUNNER_TEMP/pd/modern/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -30
          sha256sum "$APK"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Smoke test launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            APK="$RUNNER_TEMP/pd/modern/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="com.watabou.pixeldungeon.modern"
            adb install -r "$APK"
            adb logcat -c
            COMPONENT="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PACKAGE" | tail -1 | tr -d '\r')"
            test -n "$COMPONENT"
            adb shell am start -W -n "$COMPONENT"
            sleep 6
            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            test -n "$PID"
            adb exec-out screencap -p > "$RUNNER_TEMP/pixel-dungeon-title.png"
            adb logcat -d > "$RUNNER_TEMP/pixel-dungeon-logcat.txt"
            if grep -q "FATAL EXCEPTION" "$RUNNER_TEMP/pixel-dungeon-logcat.txt"; then
              grep -A80 -B10 "FATAL EXCEPTION" "$RUNNER_TEMP/pixel-dungeon-logcat.txt"
              exit 1
            fi

      - name: Package modernized source snapshot
        shell: bash
        run: |
          cd "$RUNNER_TEMP/pd"
          zip -qr pixel-dungeon-modern-source.zip modern

      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-dungeon-modern-playable
          path: |
            ${{ runner.temp }}/pd/modern/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/pixel-dungeon-title.png
            ${{ runner.temp }}/pixel-dungeon-logcat.txt
            ${{ runner.temp }}/pd/pixel-dungeon-modern-source.zip
          if-no-files-found: error
