name: Build Kai Terminal V3.3 AI APK

on:
  push:
    branches: ["build/kai-terminal-v3-3"]
  workflow_dispatch:

concurrency:
  group: kai-terminal-v3-3-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build bundled AI runtimes
        shell: bash
        run: bash tools/build_v33_runtimes.sh

      - name: Verify bundled runtime structure
        shell: bash
        run: bash tools/verify_v33_runtimes.sh

      - name: Strict ARM64 runtime smoke test
        shell: bash
        run: bash tools/smoke_v33_runtimes.sh

      - name: Verify V3.3 Android regression guards
        shell: bash
        run: bash tools/check_v33_source.sh

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build V3.3 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KaiTerminal-v3.3.0-AI.apk
          sha256sum dist/KaiTerminal-v3.3.0-AI.apk
          ls -lh dist/KaiTerminal-v3.3.0-AI.apk

      - name: Verify final APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/KaiTerminal-v3.3.0-AI.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/KaiTerminal-v3.3.0-AI.apk | head -25
          unzip -l dist/KaiTerminal-v3.3.0-AI.apk | grep -E 'lib/arm64-v8a/(libcodex|libopencode|libmusl-loader|libstdcpp|libgcccompat|libagycore|libagyld|libagyrt_)'

      - name: Smoke test packaged APK runtimes
        shell: bash
        run: bash tools/smoke_packaged_v33.sh dist/KaiTerminal-v3.3.0-AI.apk

      - name: Validate APK archive integrity
        shell: bash
        run: |
          unzip -t dist/KaiTerminal-v3.3.0-AI.apk >/tmp/apk-integrity.txt
          grep -F 'No errors detected in compressed data' /tmp/apk-integrity.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaiTerminal-v3.3.0-AI
          path: dist/KaiTerminal-v3.3.0-AI.apk
          if-no-files-found: error

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="kai-terminal-v3.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/KaiTerminal-v3.3.0-AI.apk --clobber
          else
            gh release create "$TAG" dist/KaiTerminal-v3.3.0-AI.apk \
              --target "$GITHUB_SHA" \
              --title "Kai Terminal v3.3.0" \
              --notes "Android ARM64 build with Codex Android network proxy and OpenCode auth bridge, safe AI mode switching, and VA39/glibc Antigravity runtime. Passed packaged-APK smoke tests."
          fi
