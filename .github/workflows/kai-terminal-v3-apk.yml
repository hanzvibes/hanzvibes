name: Build Kai Terminal V3 AI APK

on:
  push:
    branches: ["build/kai-terminal-v3"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download official ARM64 AI CLIs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/kai-ai/codex /tmp/kai-ai/opencode /tmp/kai-ai/agy

          curl -fL --retry 3 https://github.com/openai/codex/releases/download/rust-v0.158.0/codex-aarch64-unknown-linux-musl.tar.gz -o /tmp/codex.tar.gz
          tar -xzf /tmp/codex.tar.gz -C /tmp/kai-ai/codex
          CODEX="$(find /tmp/kai-ai/codex -type f -name 'codex*' | head -1)"
          test -n "$CODEX"
          cp "$CODEX" app/src/main/jniLibs/arm64-v8a/libcodex.so

          curl -fL --retry 3 https://github.com/anomalyco/opencode/releases/download/v1.18.33/opencode-linux-arm64-musl.tar.gz -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp/kai-ai/opencode
          OPENCODE="$(find /tmp/kai-ai/opencode -type f -name 'opencode' | head -1)"
          test -n "$OPENCODE"
          cp "$OPENCODE" app/src/main/jniLibs/arm64-v8a/libopencode.so

          curl -fL --retry 3 https://github.com/google-antigravity/antigravity-cli/releases/download/1.2.12/agy_cli_linux_arm64_musl.tar.gz -o /tmp/agy.tar.gz
          tar -xzf /tmp/agy.tar.gz -C /tmp/kai-ai/agy
          AGY="$(find /tmp/kai-ai/agy -type f \( -name 'agy' -o -name 'antigravity*' \) | head -1)"
          test -n "$AGY"
          cp "$AGY" app/src/main/jniLibs/arm64-v8a/libagy.so

          docker run --rm --platform linux/arm64             -v "$PWD/app/src/main/jniLibs/arm64-v8a:/out" alpine:3.22 sh -lc '
              set -eux
              apk add --no-cache libstdc++
              cp -L /lib/ld-musl-aarch64.so.1 /out/libmusl-loader.so
              cp -L /usr/lib/libstdc++.so.6 /out/libstdcpp.so
              cp -L /usr/lib/libgcc_s.so.1 /out/libgcccompat.so
            '

          sudo chown -R "$(id -u):$(id -g)" app/src/main/jniLibs/arm64-v8a

          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          patchelf --replace-needed libstdc++.so.6 libstdcpp.so app/src/main/jniLibs/arm64-v8a/libopencode.so
          patchelf --replace-needed libgcc_s.so.1 libgcccompat.so app/src/main/jniLibs/arm64-v8a/libopencode.so
          patchelf --replace-needed libgcc_s.so.1 libgcccompat.so app/src/main/jniLibs/arm64-v8a/libstdcpp.so
          echo "OpenCode patched dependencies:"
          patchelf --print-needed app/src/main/jniLibs/arm64-v8a/libopencode.so
          echo "libstdc++ patched dependencies:"
          patchelf --print-needed app/src/main/jniLibs/arm64-v8a/libstdcpp.so

          chmod 755 app/src/main/jniLibs/arm64-v8a/*.so
          file app/src/main/jniLibs/arm64-v8a/*.so
          du -h app/src/main/jniLibs/arm64-v8a/*.so

      - name: Verify embedded binaries are ARM64
        shell: bash
        run: |
          set -euxo pipefail
          for f in app/src/main/jniLibs/arm64-v8a/*.so; do
            readelf -h "$f" | grep -E 'Class:|Machine:|Type:'
          done

      - name: Strict smoke test all three CLIs under ARM64
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm64             -v "$PWD/app/src/main/jniLibs/arm64-v8a:/ai:ro"             alpine:3.22 sh -lc '
              set -eux
              /ai/libcodex.so --version
              /ai/libmusl-loader.so --library-path /ai /ai/libopencode.so --version
              /ai/libagy.so --version
            '

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build V3 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KaiTerminal-v3.0.0-AI.apk
          sha256sum dist/KaiTerminal-v3.0.0-AI.apk
          ls -lh dist/KaiTerminal-v3.0.0-AI.apk

      - name: Verify APK signature package and bundled runtimes
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/KaiTerminal-v3.0.0-AI.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/KaiTerminal-v3.0.0-AI.apk | head -25
          unzip -l dist/KaiTerminal-v3.0.0-AI.apk | grep -E 'lib/arm64-v8a/(libcodex|libopencode|libagy|libmusl-loader|libstdcpp|libgcccompat)'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaiTerminal-v3.0.0-AI
          path: dist/KaiTerminal-v3.0.0-AI.apk
          if-no-files-found: error
