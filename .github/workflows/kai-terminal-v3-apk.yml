name: Build Kai Terminal V3.1 AI APK

on:
  push:
    branches: ["build/kai-terminal-v3.1"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download Codex and OpenCode
        shell: bash
        run: |
          set -euxo pipefail
          OUT=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT" /tmp/kai-ai/codex /tmp/kai-ai/opencode

          curl -fL --retry 3 https://github.com/openai/codex/releases/download/rust-v0.158.0/codex-aarch64-unknown-linux-musl.tar.gz -o /tmp/codex.tar.gz
          tar -xzf /tmp/codex.tar.gz -C /tmp/kai-ai/codex
          CODEX="$(find /tmp/kai-ai/codex -type f -name 'codex*' | head -1)"
          cp "$CODEX" "$OUT/libcodex.so"

          curl -fL --retry 3 https://github.com/anomalyco/opencode/releases/download/v1.18.33/opencode-linux-arm64-musl.tar.gz -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp/kai-ai/opencode
          OPENCODE="$(find /tmp/kai-ai/opencode -type f -name 'opencode' | head -1)"
          cp "$OPENCODE" "$OUT/libopencode.so"

          docker run --rm --platform linux/arm64 -v "$PWD/$OUT:/out" alpine:3.22 sh -lc '
            set -eux
            apk add --no-cache libstdc++
            cp -L /lib/ld-musl-aarch64.so.1 /out/libmusl-loader.so
            cp -L /usr/lib/libstdc++.so.6 /out/libstdcpp.so
            cp -L /usr/lib/libgcc_s.so.1 /out/libgcccompat.so
          '
          sudo chown -R "$(id -u):$(id -g)" "$OUT"

          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          patchelf --replace-needed libstdc++.so.6 libstdcpp.so "$OUT/libopencode.so"
          patchelf --replace-needed libgcc_s.so.1 libgcccompat.so "$OUT/libopencode.so"
          patchelf --replace-needed libgcc_s.so.1 libgcccompat.so "$OUT/libstdcpp.so"

      - name: Bundle Android-compatible Antigravity runtime
        shell: bash
        run: |
          set -euxo pipefail
          OUT=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT" /tmp/agy

          # Community Android/Termux port tracks the official Google release and
          # patches VA39 memory assumptions + faccessat2 for Android seccomp.
          curl -fL --retry 3             https://github.com/wallentx/antigravity-cli-termux/releases/download/v1.2.12/antigravity-termux-standalone.tar.gz             -o /tmp/agy-termux.tar.gz
          tar -xzf /tmp/agy-termux.tar.gz -C /tmp/agy agy.va39
          cp /tmp/agy/agy.va39 "$OUT/libagy.so"

          # Static PRoot is only used to bind our generated resolver file onto
          # /etc/resolv.conf for the glibc Antigravity engine.
          curl -fL --retry 3             https://raw.githubusercontent.com/proot-me/proot-static-build/master/static/proot-arm64             -o "$OUT/libproot.so"

          # Bundle a compact glibc runtime from Debian ARM64.
          docker run --rm --platform linux/arm64 -v "$PWD/$OUT:/out" debian:bookworm-slim bash -lc '
            set -eux
            apt-get update -qq
            apt-get install -y -qq libstdc++6
            cp -L /lib/aarch64-linux-gnu/ld-linux-aarch64.so.1 /out/libagyld.so
            cp -L /lib/aarch64-linux-gnu/libc.so.6 /out/libagyc.so
            cp -L /lib/aarch64-linux-gnu/libm.so.6 /out/libagym.so
            cp -L /lib/aarch64-linux-gnu/libpthread.so.0 /out/libagypthread.so
            cp -L /lib/aarch64-linux-gnu/libdl.so.2 /out/libagydl.so
            cp -L /lib/aarch64-linux-gnu/librt.so.1 /out/libagyrt.so
            cp -L /lib/aarch64-linux-gnu/libgcc_s.so.1 /out/libagygcc.so
            cp -L /usr/lib/aarch64-linux-gnu/libstdc++.so.6 /out/libagystdcpp.so
          '
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          chmod 755 "$OUT"/*.so

          patch_one() {
            local f="$1"
            patchelf --replace-needed libc.so.6 libagyc.so "$f" 2>/dev/null || true
            patchelf --replace-needed libm.so.6 libagym.so "$f" 2>/dev/null || true
            patchelf --replace-needed libpthread.so.0 libagypthread.so "$f" 2>/dev/null || true
            patchelf --replace-needed libdl.so.2 libagydl.so "$f" 2>/dev/null || true
            patchelf --replace-needed librt.so.1 libagyrt.so "$f" 2>/dev/null || true
            patchelf --replace-needed libgcc_s.so.1 libagygcc.so "$f" 2>/dev/null || true
            patchelf --replace-needed libstdc++.so.6 libagystdcpp.so "$f" 2>/dev/null || true
          }

          patch_one "$OUT/libagy.so"
          patch_one "$OUT/libagyc.so"
          patch_one "$OUT/libagym.so"
          patch_one "$OUT/libagypthread.so"
          patch_one "$OUT/libagydl.so"
          patch_one "$OUT/libagyrt.so"
          patch_one "$OUT/libagygcc.so"
          patch_one "$OUT/libagystdcpp.so"

          echo "Antigravity NEEDED:"
          patchelf --print-needed "$OUT/libagy.so" || true

          # Fail if the engine still needs an unbundled standard glibc soname.
          if patchelf --print-needed "$OUT/libagy.so" | grep -E '^(libc\.so\.6|libm\.so\.6|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1|libgcc_s\.so\.1|libstdc\+\+\.so\.6)$'; then
            echo "Unpatched Antigravity dependency remains"
            exit 1
          fi

      - name: Verify ARM64 binaries and strict CLI smoke tests
        shell: bash
        run: |
          set -euxo pipefail
          OUT=app/src/main/jniLibs/arm64-v8a
          file "$OUT"/*.so
          for f in "$OUT"/*.so; do
            readelf -h "$f" | grep -E 'Class:|Machine:|Type:'
          done

          docker run --rm --platform linux/arm64             -v "$PWD/$OUT:/ai:ro"             alpine:3.22 sh -lc '
              set -eux
              /ai/libcodex.so --version
              /ai/libmusl-loader.so --library-path /ai /ai/libopencode.so --version
              /ai/libproot.so --version
              printf "nameserver 8.8.8.8\n" >/tmp/kai-resolv.conf
              /ai/libproot.so -b /tmp/kai-resolv.conf:/etc/resolv.conf                 /ai/libagyld.so --library-path /ai /ai/libagy.so --version
            '

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build V3.1 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KaiTerminal-v3.1.0-AI.apk
          sha256sum dist/KaiTerminal-v3.1.0-AI.apk
          ls -lh dist/KaiTerminal-v3.1.0-AI.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/KaiTerminal-v3.1.0-AI.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/KaiTerminal-v3.1.0-AI.apk | head -25
          unzip -l dist/KaiTerminal-v3.1.0-AI.apk | grep -E 'lib/arm64-v8a/(libcodex|libopencode|libagy|libproot|libproot-loader|libagyld)'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaiTerminal-v3.1.0-AI
          path: dist/KaiTerminal-v3.1.0-AI.apk
          if-no-files-found: error
