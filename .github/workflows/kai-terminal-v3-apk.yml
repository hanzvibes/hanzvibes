name: Build Kai Terminal V3.1 AI APK

on:
  push:
    branches: ["build/kai-terminal-v3.1"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf file binutils

      - name: Bundle Codex and OpenCode
        shell: bash
        run: |
          set -euxo pipefail

          OUT="app/src/main/jniLibs/arm64-v8a"
          rm -rf "$OUT"
          mkdir -p "$OUT" /tmp/kai-ai/codex /tmp/kai-ai/opencode

          curl -fL --retry 3             "https://github.com/openai/codex/releases/download/rust-v0.158.0/codex-aarch64-unknown-linux-musl.tar.gz"             -o /tmp/codex.tar.gz
          tar -xzf /tmp/codex.tar.gz -C /tmp/kai-ai/codex
          CODEX="$(find /tmp/kai-ai/codex -type f -name 'codex*' | head -1)"
          test -n "$CODEX"
          cp "$CODEX" "$OUT/libcodex.so"

          curl -fL --retry 3             "https://github.com/anomalyco/opencode/releases/download/v1.18.33/opencode-linux-arm64-musl.tar.gz"             -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp/kai-ai/opencode
          OPENCODE="$(find /tmp/kai-ai/opencode -type f -name 'opencode' | head -1)"
          test -n "$OPENCODE"
          cp "$OPENCODE" "$OUT/libopencode.so"

          docker run --rm --platform linux/arm64             -v "$PWD/$OUT:/out"             alpine:3.22 sh -lc '
              set -eux
              apk add --no-cache libstdc++
              cp -L /lib/ld-musl-aarch64.so.1 /out/libmusl-loader.so
              cp -L /usr/lib/libstdc++.so.6 /out/libstdcpp.so
              cp -L /usr/lib/libgcc_s.so.1 /out/libgcccompat.so
            '

          sudo chown -R "$(id -u):$(id -g)" "$OUT"

          patchelf --replace-needed libstdc++.so.6 libstdcpp.so "$OUT/libopencode.so"
          patchelf --replace-needed libgcc_s.so.1 libgcccompat.so "$OUT/libopencode.so"
          patchelf --replace-needed libgcc_s.so.1 libgcccompat.so "$OUT/libstdcpp.so"

      - name: Bundle Android patched Antigravity
        shell: bash
        run: |
          set -euxo pipefail

          OUT="app/src/main/jniLibs/arm64-v8a"
          mkdir -p /tmp/kai-ai/agy

          # Patched Antigravity engine for Android/Termux:
          # VA39 address-space fixes + faccessat2 -> faccessat compatibility.
          curl -fL --retry 3             "https://github.com/wallentx/antigravity-cli-termux/releases/download/v1.2.12/antigravity-termux-standalone.tar.gz"             -o /tmp/agy-termux.tar.gz
          tar -xzf /tmp/agy-termux.tar.gz -C /tmp/kai-ai/agy agy.va39
          cp /tmp/kai-ai/agy/agy.va39 "$OUT/libagy.so"

          # PRoot fork built specifically for modern Android / targetSdk 35.
          # Both binaries must remain in nativeLibraryDir at runtime.
          curl -fL --retry 3             "https://raw.githubusercontent.com/oonid/pr/main/android/proot-engine/src/main/jniLibs/arm64-v8a/libproot.so"             -o "$OUT/libproot.so"
          curl -fL --retry 3             "https://raw.githubusercontent.com/oonid/pr/main/android/proot-engine/src/main/jniLibs/arm64-v8a/libproot-loader.so"             -o "$OUT/libproot-loader.so"

          # Compact ARM64 glibc runtime for the patched Antigravity engine.
          docker run --rm --platform linux/arm64             -v "$PWD/$OUT:/out"             debian:bookworm-slim bash -lc '
              set -eux
              apt-get update -qq
              apt-get install -y -qq libstdc++6

              cp -L /lib/aarch64-linux-gnu/ld-linux-aarch64.so.1 /out/libagyld.so
              cp -L /lib/aarch64-linux-gnu/libc.so.6 /out/libagyc.so
              cp -L /lib/aarch64-linux-gnu/libm.so.6 /out/libagym.so
              cp -L /lib/aarch64-linux-gnu/libpthread.so.0 /out/libagypthread.so
              cp -L /lib/aarch64-linux-gnu/libdl.so.2 /out/libagydl.so
              cp -L /lib/aarch64-linux-gnu/librt.so.1 /out/libagyrt.so
              cp -L /lib/aarch64-linux-gnu/libgcc_s.so.1 /out/libagygcc.so
              cp -L /usr/lib/aarch64-linux-gnu/libstdc++.so.6 /out/libagystdcpp.so
            '

          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          chmod 755 "$OUT"/*.so

          patch_needed() {
            local file="$1"
            patchelf --replace-needed libc.so.6 libagyc.so "$file" 2>/dev/null || true
            patchelf --replace-needed libm.so.6 libagym.so "$file" 2>/dev/null || true
            patchelf --replace-needed libpthread.so.0 libagypthread.so "$file" 2>/dev/null || true
            patchelf --replace-needed libdl.so.2 libagydl.so "$file" 2>/dev/null || true
            patchelf --replace-needed librt.so.1 libagyrt.so "$file" 2>/dev/null || true
            patchelf --replace-needed libgcc_s.so.1 libagygcc.so "$file" 2>/dev/null || true
            patchelf --replace-needed libstdc++.so.6 libagystdcpp.so "$file" 2>/dev/null || true
          }

          patch_needed "$OUT/libagy.so"
          patch_needed "$OUT/libagyc.so"
          patch_needed "$OUT/libagym.so"
          patch_needed "$OUT/libagypthread.so"
          patch_needed "$OUT/libagydl.so"
          patch_needed "$OUT/libagyrt.so"
          patch_needed "$OUT/libagygcc.so"
          patch_needed "$OUT/libagystdcpp.so"

          echo "Antigravity dependencies after patch:"
          patchelf --print-needed "$OUT/libagy.so" || true

          if patchelf --print-needed "$OUT/libagy.so" |             grep -E '^(libc\.so\.6|libm\.so\.6|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1|libgcc_s\.so\.1|libstdc\+\+\.so\.6)$'; then
            echo "ERROR: unpatched Antigravity dependency remains"
            exit 1
          fi

      - name: Verify binary architecture
        shell: bash
        run: |
          set -euxo pipefail

          OUT="app/src/main/jniLibs/arm64-v8a"
          file "$OUT"/*.so

          for f in "$OUT"/*.so; do
            readelf -h "$f" | grep -E 'Class:|Machine:|Type:'
          done

          test -s "$OUT/libproot.so"
          test -s "$OUT/libproot-loader.so"

      - name: Strict Linux ARM64 smoke test
        shell: bash
        run: |
          set -euxo pipefail

          OUT="app/src/main/jniLibs/arm64-v8a"

          # PRoot itself is Android/Bionic-specific and cannot be meaningfully
          # executed inside an Alpine Docker container. Verify its ELF above.
          # Here we execute all three AI engines directly under ARM64.
          docker run --rm --platform linux/arm64             -v "$PWD/$OUT:/ai:ro"             alpine:3.22 sh -lc '
              set -eux
              /ai/libcodex.so --version
              /ai/libmusl-loader.so --library-path /ai /ai/libopencode.so --version
              /ai/libagyld.so --library-path /ai /ai/libagy.so --version
            '

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build V3.1 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KaiTerminal-v3.1.0-AI.apk
          sha256sum dist/KaiTerminal-v3.1.0-AI.apk
          ls -lh dist/KaiTerminal-v3.1.0-AI.apk

      - name: Verify APK signature and payload
        shell: bash
        run: |
          set -euxo pipefail
          APK="dist/KaiTerminal-v3.1.0-AI.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify             --verbose --print-certs "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -25

          unzip -l "$APK" | grep -E             'lib/arm64-v8a/(libcodex|libopencode|libagy|libproot|libproot-loader|libagyld)\.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaiTerminal-v3.1.0-AI
          path: dist/KaiTerminal-v3.1.0-AI.apk
          if-no-files-found: error
