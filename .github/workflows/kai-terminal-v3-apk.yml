                opencode() { /ai/libmusl-loader.so --library-path /ai /ai/libopencode.so "$@"; }
                agy() { PREFIX=/tmp/kai-agy GODEBUG=netdns=cgo SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt /ai/libagyld.so --library-path /ai /ai/libagycore.so "$@"; }
