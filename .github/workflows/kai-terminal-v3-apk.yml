            -v "$PWD/app/src/main/jniLibs/arm64-v8a:/ai:ro" \
            alpine:3.22 sh -lc '
              set -eux
              /ai/libcodex.so --version
              /ai/libmusl-loader.so --library-path /ai /ai/libopencode.so --version
              PREFIX=/tmp/kai-agy GODEBUG=netdns=cgo SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt /ai/libagyld.so --library-path /ai /ai/libagycore.so --version
              PREFIX=/tmp/kai-agy GODEBUG=netdns=cgo SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt /ai/libagyld.so --library-path /ai /ai/libagycore.so --help >/dev/null
            '

      - name: Verify V3.3 Android regression guards
        shell: bash
        run: |
          set -euxo pipefail
          SRC=app/src/main/java/com/kai/terminal/MainActivity.java
          grep -F 'ChatGPT Pro/Plus (headless)' "$SRC"
          grep -F 'codex login --device-auth' "$SRC"
          grep -F 'modeRow' "$SRC"
          grep -F 'byte[] readBuffer = new byte[2048]' "$SRC"
          grep -F 'command.startsWith("!")' "$SRC"
          grep -F 'Ask " + modeLabel(session.mode)' "$SRC"
          grep -F 'cleanProcessChunk(session' "$SRC"
          grep -F 'codexAuthWaitingShown' "$SRC"
          grep -F 'Selesaikan login di browser memakai URL + kode di atas.' "$SRC"
          grep -F 'showCodexDeviceDialog(session, url, code)' "$SRC"
          grep -F 'CODEX_DEVICE_CODE_TTL_MS' "$SRC"
          grep -F 'RETRY LOGIN' "$SRC"
          grep -F 'Device code copied. Tap OPEN LOGIN.' "$SRC"
