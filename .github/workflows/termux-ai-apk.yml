name: Build Termux AI APK

on:
  push:
    branches:
      - 'termux-ai/ui-v2'
    paths:
      - '.termux-ai/TRIGGER_BUILD'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch audited Termux source
        run: |
          git clone https://github.com/termux/termux-app.git termux-src
          cd termux-src
          git checkout 8629e632fcb95da272221be327db653fb24befe9

      - name: Apply Termux AI rebuild
        run: python3 .termux-ai/apply.py termux-src

      - name: Build Android 7+ APKs
        working-directory: termux-src
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APK_VERSION_TAG: termux-ai-v2-ui
          TERMUX_APP_VERSION_NAME: 0.118.3-ai.2
        run: ./gradlew --no-daemon assembleDebug

      - name: Show APK outputs
        run: find termux-src/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -printf '%f %k KB\n'

      - name: Upload installable APKs
        uses: actions/upload-artifact@v6
        with:
          name: termux-ai-v2-ui-apks
          if-no-files-found: error
          retention-days: 7
          path: |
            termux-src/app/build/outputs/apk/debug/*arm64-v8a.apk
            termux-src/app/build/outputs/apk/debug/*universal.apk
