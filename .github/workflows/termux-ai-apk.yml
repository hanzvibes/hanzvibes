name: Build AI Workspace Native APK

on:
  push:
    branches:
      - 'termux-ai/v5-4-structured-native'
    paths:
      - '.termux-ai/TRIGGER_BUILD_V5_4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout native rebuild kit
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch audited runtime source
        run: |
          git clone https://github.com/termux/termux-app.git termux-src
          cd termux-src
          git checkout 8629e632fcb95da272221be327db653fb24befe9

      - name: Apply native AI Workspace rebuild
        run: python3 .termux-ai/apply.py termux-src

      - name: Assert no WebView terminal UI is bundled
        run: |
          test ! -e termux-src/app/src/main/assets/terminal-ui
          test ! -e termux-src/app/src/main/java/com/termux/app/ai/AiTerminalViewport.java
          test -f termux-src/app/src/main/java/com/termux/app/NativeAiActivity.java
          grep -q 'androidx.recyclerview:recyclerview' termux-src/app/build.gradle
          grep -q 'NativeAiActivity' termux-src/app/src/main/AndroidManifest.xml
          test -f termux-src/app/src/main/assets/native-ai/opencode-native-driver
          grep -q 'opencode run --format json' termux-src/app/src/main/assets/native-ai/opencode-native-driver

      - name: Build Android 7+ native APKs
        working-directory: termux-src
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APK_VERSION_TAG: ai-workspace-v5.4-structured-native
          TERMUX_APP_VERSION_NAME: 0.118.3-ai.5.4
        run: ./gradlew --no-daemon assembleDebug

      - name: Show APK outputs
        run: find termux-src/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -printf '%f %k KB\n'

      - name: Upload installable APKs
        uses: actions/upload-artifact@v6
        with:
          name: ai-workspace-v5.4-structured-native-apks
          if-no-files-found: error
          retention-days: 7
          path: |
            termux-src/app/build/outputs/apk/debug/*arm64-v8a.apk
            termux-src/app/build/outputs/apk/debug/*universal.apk
