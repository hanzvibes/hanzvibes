name: Build Termux AI APK

on:
  push:
    branches:
      - 'termux-ai/ui-v4-3-root-mount-fix'
    paths:
      - '.termux-ai/TRIGGER_BUILD_V4_3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install brainless TerminalViewport components
        working-directory: .termux-ai/terminal-ui
        run: |
          bun install
          bunx --bun shadcn@latest add @brainless/claude-session @brainless/codex-session @brainless/grok-session @brainless/grok-thinking @brainless/grok-working --yes
          bun run build
          python3 inline_dist.py
          test ! -d dist/assets
          python3 -c "from pathlib import Path; s=Path('dist/index.html').read_text(); root=s.find('<div id=\\\"root\\\"></div>'); script=s.rfind('<script>'); assert root >= 0 and script > root, (root, script); assert 'TermuxNative' in s and 'createRoot' in s; print('Verified React mount order:', root, script)"

      - name: Fetch audited Termux source
        run: |
          git clone https://github.com/termux/termux-app.git termux-src
          cd termux-src
          git checkout 8629e632fcb95da272221be327db653fb24befe9

      - name: Apply Termux AI rebuild
        run: python3 .termux-ai/apply.py termux-src

      - name: Embed brainless TerminalViewport bundle
        run: |
          rm -rf termux-src/app/src/main/assets/terminal-ui
          mkdir -p termux-src/app/src/main/assets/terminal-ui
          cp -R .termux-ai/terminal-ui/dist/. termux-src/app/src/main/assets/terminal-ui/
          test -f termux-src/app/src/main/assets/terminal-ui/index.html

      - name: Build Android 7+ APKs
        working-directory: termux-src
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APK_VERSION_TAG: termux-ai-v4.3-brainless
          TERMUX_APP_VERSION_NAME: 0.118.3-ai.4.3
        run: ./gradlew --no-daemon assembleDebug

      - name: Show APK outputs
        run: find termux-src/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -printf '%f %k KB\n'

      - name: Upload installable APKs
        uses: actions/upload-artifact@v6
        with:
          name: termux-ai-v4-3-brainless-apks
          if-no-files-found: error
          retention-days: 7
          path: |
            termux-src/app/build/outputs/apk/debug/*arm64-v8a.apk
            termux-src/app/build/outputs/apk/debug/*universal.apk
